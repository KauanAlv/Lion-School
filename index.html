<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion School</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="shortcut icon" href="./img/logo-image.png" type="image/x-icon">
<!--     <script type="module" src="./js/main.js" defer></script> -->
</head>

<body>

    <header>
        <div class="header-logo">
            <div class="logo">
                <img src="./img/logo-image.png" alt="Logo">
                <span>Lion School</span>
            </div>

            <div class="sair" id="botao-header">
                <img src="./img/seta.png" alt="Seta de Sair">
                <span id="texto-header">Sair</span>
            </div>
        </div>
    </header>

    <main id="main" class="main-aluno">
        <div class="hero-aluno">
            <div class="caixa aluno">
                <img src="./img/icon-aluno.png" alt="Foto do Aluno">
                <span>José Matheus da Silva Miranda</span>
            </div>

            <div class="caixa grafico">
                <div class="columns">
                    <span class="nota">75</span>
                    <div class="column">
                        <div class="valor"></div>
                    </div>
                    <span class="sigla">SOP</span>
                </div>
                <div class="columns">
                    <span class="nota">30</span>
                    <div class="column">
                        <div class="valor"></div>
                    </div>
                    <span class="sigla">IPR</span>
                </div>
                <div class="columns">
                    <span class="nota">50</span>
                    <div class="column">
                        <div class="valor"></div>
                    </div>
                    <span class="sigla">MAT</span>
                </div>
                <div class="columns">
                    <span class="nota">80</span>
                    <div class="column">
                        <div class="valor"></div>
                    </div>
                    <span class="sigla">POR</span>
                </div>
                <div class="columns">
                    <span class="nota">60</span>
                    <div class="column">
                        <div class="valor"></div>
                    </div>
                    <span class="sigla">GEO</span>
                </div>
                <div class="columns">
                    <span class="nota">100</span>
                    <div class="column">
                        <div class="valor"></div>
                    </div>
                    <span class="sigla">CIE</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="frame">
            <div class="contato">
                <div class="icons">
                    <img src="./img/telefone.png" alt="Telefone">
                    <img src="./img/icon-email.png" alt="Email">
                    <img src="./img/localizacao.png" alt="Localização">
                </div>

                <div class="info-icons">
                    <span class="telefone">(11) 99999-9999</span>
                    <span class="email">lionschool@gmail.com</span>
                    <span class="endereco">Rua tcc, 211, Centro, Jandira</span>
                </div>

            </div>

            <span class="copyright">Copyright © 2026 | Fernando Leonid</span>

            <div class="redes-sociais">
                <div class="borda">
                    <img src="./img/youtube.png" alt="">
                </div>

                <div class="borda">
                    <img src="./img/twitter.png" alt="">
                </div>

                <div class="borda">
                    <img src="./img/instagram.png" alt="">
                </div>

                <div class="borda">
                    <img src="./img/facebook.png" alt="">
                </div>
            </div>
        </div>
    </footer>

</body>

</html>
