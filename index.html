<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion School</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="shortcut icon" href="./img/logo-image.png" type="image/x-icon">
    <script type="module" src="./js/main.js" defer></script>
</head>

<body>
    
    <header>
        <div class="logo">
            <img src="./img/logo-image.png" alt="Logo">
            <span>Lion School</span>
        </div>

        <div class="sair">
            <img src="./img/seta.png" alt="Seta de Sair">
            <span>Sair</span>
        </div>
    </header>


    <main id="main">
        <div class="hero">
            <div class="hero-left">
                <p>Escolha um <span>curso</span> para gerenciar<p>
                    <img src="./img/dispositivos.png" alt="Dispostivos (celular, tablet e computador)">
            </div>

            <div class="hero-center">
                <img src="./img/estudante.png" alt="Estudante">
            </div>

            <div class="hero-right">
                <button class="btn-ds">
                    <img src="./img/ds.png" alt="Logo DS">
                    <span>DS</span>
                </button>

                <button class="btn-redes">
                    <img src="./img/redes.png" alt="Logo Redes">
                    <span>REDES</span>
                </button>
            </div>
        </div>
    </main>


    <footer>
        <div class="frame">
            <div class="contato">
                <div class="icons">
                    <img src="./img/telefone.png" alt="Telefone">
                    <img src="./img/icon-email.png" alt="Email">
                    <img src="./img/localizacao.png" alt="Localização">
                </div>

                <div class="info-icons">
                    <span class="telefone">(11) 99999-9999</span>
                    <span class="email">lionschool@gmail.com</span>
                    <span class="endereco">Rua tcc, 211, Centro, Jandira</span>
                </div>

            </div>

            <span class="copyright">Copyright © 2026 | Fernando Leonid</span>

            <div class="redes-sociais">
                <div class="borda">
                    <img src="./img/youtube.png" alt="">
                </div>

                <div class="borda">
                    <img src="./img/twitter.png" alt="">
                </div>

                <div class="borda">
                    <img src="./img/instagram.png" alt="">
                </div>

                <div class="borda">
                    <img src="./img/facebook.png" alt="">
                </div>
            </div>
        </div>
    </footer>

</body>

</html>
